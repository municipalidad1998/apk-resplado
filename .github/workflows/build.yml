name: Android verification
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Firma estable para las actualizaciones
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/lumina.jks
          elif [ ! -f keystore/lumina.jks ]; then
            keytool -genkeypair -v -keystore keystore/lumina.jks -storetype JKS \
              -storepass lumina-denilson -keypass lumina-denilson -alias denilson \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Reproductor de musica Denilson, OU=Musica, O=Denilson, C=GT"
          fi
          ls -l keystore
      - name: Guardar la clave generada
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/01a0d0df-apk-resplado'
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then echo "Usando el keystore del secreto."; exit 0; fi
          if ! git ls-files --error-unmatch keystore/lumina.jks >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f keystore/lumina.jks
            git commit -m "build: fijar clave de firma estable para las actualizaciones [skip ci]"
            git push origin HEAD:arena/01a0d0df-apk-resplado
          fi
      - name: Build and verify
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace > verification.log 2>&1
          result=$?
          cat verification.log
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYLOG'
          import re
          from pathlib import Path
          lines = Path('verification.log').read_text().splitlines()
          errors = [line for line in lines if re.search(r'^e:|error:|Error:|What went wrong|Could not|FAILURE|SDK|not found|Exception', line)]
          for line in (errors or lines[-30:])[:40]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYLOG
          fi
          exit "$result"
      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PYTEST'
          import glob, os, xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for file in files:
              root = ET.parse(file).getroot()
              for key in totals: totals[key] += int(root.get(key, 0))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## JVM tests\n' + str(totals) + '\n')
          print('::notice::JVM tests: ' + str(totals))
          PYTEST
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumina-build-reports
          path: |
            verification.log
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/schemas/
      - uses: actions/upload-artifact@v4
        with:
          name: lumina-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lumina-test-apk
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  device-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: lumina-debug-apk
          path: apks/app
      - uses: actions/download-artifact@v4
        with:
          name: lumina-test-apk
          path: apks/test
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumina-device-reports
          path: device-reports/
  publish-apk:
    needs: [build, device-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/01a0d0df-apk-resplado'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: lumina-debug-apk
          path: apks/app
      - name: Name the installable APK
        run: |
          mkdir -p release
          cp apks/app/app-debug.apk release/reproductor-denilson-2.2.0.apk
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0
          name: Reproductor de música Denilson 2.2.0
          body: |
            APK generado y verificado por este flujo (pruebas JVM, Lint y pruebas
            instrumentadas en Android 15). Mantiene la misma firma que la versión anterior,
            así que se actualiza sin desinstalar y sin perder la biblioteca.

            Instalación: descarga `reproductor-denilson-2.2.0.apk` y ábrelo en el teléfono.
            La primera vez, Android pedirá autorizar "Instalar apps desconocidas" para el
            navegador o el gestor de archivos que uses. Después de instalar, la app misma
            puede buscar e instalar las siguientes versiones desde Ajustes → Actualizaciones.

            YouTube: el botón abre la búsqueda en la app oficial de YouTube. La app no bloquea
            anuncios ni reproduce YouTube en segundo plano; eso depende de YouTube Premium.
          files: release/reproductor-denilson-2.2.0.apk
          fail_on_unmatched_files: true
