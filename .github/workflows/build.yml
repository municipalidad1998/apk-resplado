name: Android verification
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace > verification.log 2>&1
          result=$?
          cat verification.log
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYLOG'
          import re
          from pathlib import Path
          lines = Path('verification.log').read_text().splitlines()
          errors = [line for line in lines if re.search(r'^e:|error:|Error:|What went wrong|Could not|FAILURE|SDK|not found|Exception', line)]
          for line in (errors or lines[-30:])[:40]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYLOG
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumina-build-reports
          path: |
            verification.log
            app/build/reports/
            app/build/outputs/androidTest-results/
      - uses: actions/upload-artifact@v4
        with:
          name: lumina-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lumina-test-apk
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  device-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumina-device-reports
          path: app/build/reports/androidTests/
